[package]
name = "studio-native-media-experiment"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
png = "=0.17.16"
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL", "NSError", "NSValue", "NSObject"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetTrack", "AVAssetReader", "AVAssetReaderOutput", "AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings", "AVAudioSettings", "AVMediaFormat", "block2", "objc2-core-media", "objc2-core-video", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
