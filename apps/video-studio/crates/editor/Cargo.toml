[package]
name = "video-studio"
version.workspace = true
edition.workspace = true

[dependencies]
png = "=0.17.16"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
libc = "0.2"
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", features = ["exception"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL", "NSError", "NSValue", "NSObject", "NSProcessInfo", "NSBundle"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFString", "CFArray", "CFNumber"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetTrack", "AVAssetReader", "AVAssetReaderOutput", "AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings", "AVAudioSettings", "AVMediaFormat", "block2", "objc2-core-media", "objc2-core-video", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[lints]
workspace = true
